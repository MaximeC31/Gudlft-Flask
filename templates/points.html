<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points Board || GUDLFT</title>
</head>
<body>
    <a href="{{url_for('index')}}">Home</a>
    <h1>Points Board</h1>
    {% if clubs %}
        <table>
            <tr>
                <th>Club</th>
                <th>Points</th>
            </tr>
            {% for club in clubs %}
                <tr>
                    <td>{{club['name']}}</td>
                    <td>{{club['points']}}</td>
                </tr>
            {% endfor %}
        </table>
        {% endif %}
    {% if not clubs %}
        <p>Aucun club disponible</p>
        {% endif %}
    </body>
    </html>
